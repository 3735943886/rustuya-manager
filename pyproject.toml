[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rustuya-manager"
# Single source of truth: src/rustuya_manager/__init__.py:__version__. Bump it
# there only — this resolves it at build time, web.py reads it at runtime, and
# check.sh reads it from the installed package. See [tool.setuptools.dynamic].
dynamic = ["version"]
description = "Management tool for rustuya-bridge — keeps Tuya Cloud devices and the bridge in sync"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "aiomqtt>=2.0",
    "pyrustuyabridge>=0.4.0.dev2",  # render_command (0.4.0-dev.2): command topics/payloads rendered by the bridge's own code, e.g. a one-DP set on a `{dp}` command template. The 0.4 line also carries the embedded bridge 0.4 (rustuya 0.4 beta). History of the earlier floors: see git log of this line.
    "tuyawizard>=0.1.9",  # 0.1.8 added close()/context manager to stop the per-call requests.Session leak (~750-950 KB/cycle); 0.1.9 then changed close()'s default so it no longer POSTs to `/v1.0/m/token/terminal/expire` — the previous default revoked the saved tokens server-side after every wizard run, forcing a fresh QR scan on the next call. Manager's wizard.close() is called with no args so it picks up the new revoke_terminal=False default automatically.
    "qrcode>=8.0",  # WizardManager (wizard.py) renders the QR-login URL as an SVG data-URL unconditionally on the QR fallback path — this is core onboarding, not GUI-only. Previously undeclared (pulled in transitively via tuyawizard); declared directly since wizard.py imports it itself.
    "cryptography>=41",   # missing dep of tuya-sharing-sdk
    "packaging>=23",      # PEP440 parse/compare for the Info panel's PyPI update check (max-incl-prereleases vs installed); already present transitively, declared since versions.py imports it directly
]

[project.optional-dependencies]
# fastapi/uvicorn power the web UI only — core functionality (State, BridgeClient,
# the Manager facade, cloud/catalog/plugin logic) has zero dependency on them, so
# a library-only install (`pip install rustuya-manager`) stays lean. Every
# documented deployment path (Docker, pipx/systemd) runs with --web and must
# install this extra: `pip install rustuya-manager[web]`.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dev = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-playwright>=0.5",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
rustuya-manager = "rustuya_manager.cli:main"

[tool.setuptools.dynamic]
version = { attr = "rustuya_manager.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rustuya_manager = ["templates/*.html", "static/*.js", "static/*.css", "static/locales/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# e2e_ui boots uvicorn in a session-scoped daemon thread and drives the page
# via Playwright's sync API (greenlet bridge). Both leak event-loop state into
# the main thread, which then collides with pytest-asyncio's per-test Runner
# when async unit tests run in the same session. Default to excluding e2e here
# so a bare `pytest` is fast and conflict-free; CI runs `pytest -m e2e` in a
# separate step.
addopts = "-m 'not e2e'"
markers = [
    "e2e: browser-driven UI smoke tests (Playwright + uvicorn); run separately",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = [
    "E501",  # formatter handles line length
    "B008",  # FastAPI Depends/Body in defaults
]

[tool.ruff.lint.isort]
known-first-party = ["rustuya_manager"]

[tool.ruff.format]
quote-style = "double"
